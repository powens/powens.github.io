[goldmark]
  [goldmark.parser]
    wrapStandAloneImageWithinParagraph = false

    [goldmark.parser.attribute]
      block = true

  [goldmark.renderer]
    unsafe = true

  # Hugo replaces the theme's markup config rather than merging it, so this
  # must be repeated here or Goldmark mangles math delimiters before KaTeX.
  [goldmark.extensions]
    [goldmark.extensions.passthrough]
      enable = true
      [goldmark.extensions.passthrough.delimiters]
        block = [['\[', '\]'], ['$$', '$$']]
        inline = [['\(', '\)']]

[highlight]
  noClasses = false

# h2 only: including h3s made the TOC on longer posts run a full screen.
[tableOfContents]
  startLevel = 2
  endLevel = 2
