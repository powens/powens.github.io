colorScheme = "blowfish"
defaultAppearance = "light"
autoSwitchAppearance = true

enableSearch = true
enableCodeCopy = true

mainSections = ["posts"]

disableImageOptimization = false

# The profile homepage already prints the name as its <h1>; printing it in
# the header too said it twice on the page it matters most. The logo below
# keeps a home link in the header (Blowfish gives it an sr-only site title),
# which disabling the text alone would have removed entirely.
disableTextInHeader = true
logo = "img/logo.svg"

fingerprintAlgorithm = "sha512"

# Fallback card image for pages with no featured image of their own.
defaultSocialImage = "img/og-default.png"

[sitemap]
  excludedKinds = []

[header]
  layout = "basic"

[footer]
  showMenu = true
  showCopyright = true
  showThemeAttribution = true
  showAppearanceSwitcher = true
  showScrollToTop = true

[homepage]
  layout = "profile"
  showRecent = true
  showRecentItems = 5
  showMoreLink = true
  showMoreLinkDest = "/posts/"

[article]
  externalLinkForceNewTab = false
  showDate = true
  showAuthor = false
  showBreadcrumbs = false
  showDraftLabel = true
  showHeadingAnchors = true
  showPagination = true
  showReadingTime = true
  showTableOfContents = true
  showTaxonomies = true
  showTags = true
  showWordCount = true

[list]
  showSummary = true
  constrainItemsWidth = true
  groupByYear = true

[taxonomy]
  showTermCount = true

[term]
  showTableOfContents = false
