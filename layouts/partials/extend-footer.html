{{/*
  Adds what the theme lacks: a focus trap for the mobile menu dialog, and a
  "no results" message for search. Uses only utility classes the theme's
  precompiled Tailwind already contains.
*/}}
<script>
  (function () {
    "use strict";

    var NO_RESULTS = {{ i18n "search.no_results" | default "No results for “%s”." }};

    function trapMobileMenuFocus() {
      var toggle = document.getElementById("mobile-menu-toggle");
      var dialog = document.getElementById("mobile-menu-dialog");
      if (!toggle || !dialog) return;

      var SELECTOR = [
        'a[href]',
        'button:not([disabled])',
        'input:not([disabled]):not([type="hidden"])',
        'select:not([disabled])',
        'textarea:not([disabled])',
        '[tabindex]:not([tabindex="-1"])',
      ].join(",");

      function focusable() {
        return Array.prototype.filter.call(dialog.querySelectorAll(SELECTOR), function (el) {
          if (window.getComputedStyle(el).visibility === "hidden") return false;
          return el.offsetWidth > 0 || el.offsetHeight > 0 || el.getClientRects().length > 0;
        });
      }

      // Search can open over the menu ("/" shortcut) with its own Tab trap;
      // stand down so ours doesn't pull focus behind it.
      function searchIsOpen() {
        var searchWrapper = document.getElementById("search-wrapper");
        if (!searchWrapper) return false;
        return window.getComputedStyle(searchWrapper).visibility === "visible";
      }

      // Retried across frames: the dialog is revealed by a CSS transition, so
      // focus() is a no-op until styles recalculate.
      function focusFirstItem(frames) {
        if (!toggle.checked) return;
        var items = focusable();
        if (items.length) {
          items[0].focus();
          if (document.activeElement === items[0]) return;
        }
        if (frames < 30) {
          window.requestAnimationFrame(function () {
            focusFirstItem(frames + 1);
          });
        }
      }

      toggle.addEventListener("change", function () {
        if (toggle.checked) focusFirstItem(0);
      });

      document.addEventListener("keydown", function (event) {
        if (event.key !== "Tab" || !toggle.checked || searchIsOpen()) return;
        var items = focusable();
        if (!items.length) return;
        var first = items[0];
        var last = items[items.length - 1];

        if (!dialog.contains(document.activeElement)) {
          event.preventDefault();
          (event.shiftKey ? last : first).focus();
        } else if (event.shiftKey && document.activeElement === first) {
          event.preventDefault();
          last.focus();
        } else if (!event.shiftKey && document.activeElement === last) {
          event.preventDefault();
          first.focus();
        }
      });
    }

    function addSearchEmptyState() {
      var wrapper = document.getElementById("search-wrapper");
      var input = document.getElementById("search-query");
      var output = document.getElementById("search-results");
      if (!wrapper || !input || !output) return;

      // Outside #search-results so the theme's innerHTML reset doesn't wipe it.
      var message = document.createElement("p");
      message.id = "search-no-results";
      message.className = "px-3 py-2 text-sm italic text-neutral-500 dark:text-neutral-400";
      message.setAttribute("role", "status");
      message.setAttribute("aria-live", "polite");
      message.hidden = true;
      output.insertAdjacentElement("afterend", message);

      var pending = null;

      function hide() {
        message.hidden = true;
        message.textContent = "";
      }

      function evaluate(attempt) {
        var term = input.value.trim();
        if (!term || output.children.length > 0) {
          hide();
          return;
        }
        // Empty results may just mean the index hasn't loaded yet, and the
        // theme won't re-run the query when it does. Wait, then re-query.
        if (!window.fuse) {
          if (attempt < 20) {
            pending = window.setTimeout(function () {
              evaluate(attempt + 1);
            }, 100);
          }
          return;
        }
        if (attempt > 0 && typeof window.executeQuery === "function") {
          window.executeQuery(term);
          if (output.children.length > 0) {
            hide();
            return;
          }
        }
        message.textContent = NO_RESULTS.replace("%s", term);
        message.hidden = false;
      }

      // Runs after the theme's onkeyup handler has rendered results.
      input.addEventListener("keyup", function () {
        window.clearTimeout(pending);
        evaluate(0);
      });

      // Reset when the theme's hideSearch() hides the wrapper.
      new MutationObserver(function () {
        if (wrapper.style.visibility === "hidden") {
          window.clearTimeout(pending);
          hide();
        }
      }).observe(wrapper, { attributes: true, attributeFilter: ["style"] });
    }

    function init() {
      trapMobileMenuFocus();
      addSearchEmptyState();
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", init);
    } else {
      init();
    }
  })();
</script>
